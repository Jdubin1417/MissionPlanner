name: OSX Build
on: [push, workflow_dispatch, pull_request]

jobs:
  buildIOS:
    name: Build IOS
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
          fetch-depth: 10

      - name: Cache multiple paths
        uses: actions/cache@v4
        with:
          path: |
            **/obj/**
          key: ${{ runner.os }}-buildIOS

      - name: Build
        shell: pwsh
        run: |
          brew install --cask xamarin-ios
          brew install --cask xamarin-android
          brew install --cask xamarin-mac
          msbuild -ver
          dotnet --version
          dotnet --list-sdks
          msbuild -v:m -restore  -p:Configuration=Release "ExtLibs\Xamarin\Xamarin.iOS\Xamarin.iOS.csproj"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ExtLibs/Xamarin/Xamarin.iOS/bin/iPhoneSimulator/Release/

  buildOSX:
    name: Build OSX
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
          fetch-depth: 10

      - name: Cache multiple paths
        uses: actions/cache@v4
        with:
          path: |
            **/obj/**
          key: ${{ runner.os }}-buildOSX

      - name: Build
        shell: pwsh
        run: |
          brew install --cask xamarin-ios
          brew install --cask xamarin-android
          brew install --cask xamarin-mac
          msbuild -ver
          dotnet --version
          dotnet --list-sdks
          msbuild -v:m -restore  -p:Configuration=Release "ExtLibs\Xamarin\Xamarin.MacOS\Xamarin.MacOS.csproj"

      - name: Startup smoke tests
        shell: bash
        run: |
          app="ExtLibs/Xamarin/Xamarin.MacOS/bin/Release/Mission Planner.app"
          executable="$app/Contents/MacOS/Mission Planner"
          log="${RUNNER_TEMP}/mission-planner-smoke.log"

          "$executable" --startup-resource-smoke-test

          "$executable" >"$log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if grep -q "start AutoConnect" "$log"; then
              echo "Mission Planner reached its main startup path."
              exit 0
            fi

            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Mission Planner exited before startup completed."
              cat "$log"
              exit 1
            fi

            sleep 1
          done

          echo "Mission Planner did not finish startup within 60 seconds."
          cat "$log"
          exit 1

      - name: Package
        shell: pwsh
        run: |
          npm install --global create-dmg
          cd ExtLibs/Xamarin/Xamarin.MacOS/bin/Release/
          create-dmg 'Mission Planner.app' --dmg-title='Mission Planner' --no-code-sign
          
      - uses: actions/upload-artifact@v4
        with:
          name: osx
          path: |
            ExtLibs/Xamarin/Xamarin.MacOS/bin/Release/*.dmg

      - uses: "marvinpinto/action-automatic-releases@v1.2.1"
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "osxlatest"
          prerelease: true
          title: "OSX Development Build"
          files: '**/*.dmg'
